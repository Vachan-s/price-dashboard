<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
    header span { font-size: 1.5rem; }

    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-pill {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill strong { color: #1a1a2e; }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 22px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    #btn-scrape {
      background: #4f46e5;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #btn-scrape:hover:not(:disabled) { opacity: 0.88; }

    #btn-export {
      background: #fff;
      color: #4f46e5;
      border: 1.5px solid #4f46e5;
    }
    #btn-export:hover:not(:disabled) { background: #f0effe; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    #empty-state {
      padding: 60px 24px;
      text-align: center;
      color: #888;
    }
    #empty-state p { margin-top: 8px; font-size: 0.9rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    thead { background: #f8fafc; }
    thead th {
      padding: 14px 18px;
      text-align: left;
      font-weight: 600;
      color: #555;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e2e8f0;
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }
    td { padding: 13px 18px; vertical-align: middle; }

    .sku-badge {
      background: #f0f2f5;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      font-family: monospace;
    }

    .price { font-weight: 600; color: #1a1a2e; font-size: 1rem; }

    .tenxyou-price {
      display: inline-block;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .gap-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .gap-positive { background: #fee2e2; color: #dc2626; }
    .gap-negative { background: #dcfce7; color: #15803d; }
    .gap-neutral  { background: #f1f5f9; color: #888; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-partial { background: #fef9c3; color: #854d0e; }
    .status-error   { background: #fee2e2; color: #dc2626; }

    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<header>
  <span>📊</span>
  <h1>Price Dashboard</h1>
</header>

<main>
  <div class="stats-bar">
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div class="stat-pill">SKUs scraped: <strong id="stat-count">—</strong></div>
      <div class="stat-pill">Last scrape: <strong id="stat-time">—</strong></div>
    </div>
    <div class="actions">
      <button id="btn-scrape">
        <div class="spinner" id="spinner"></div>
        <span id="btn-scrape-label">Scrape Now</span>
      </button>
      <button id="btn-export">Export CSV</button>
    </div>
  </div>

  <div class="card">
    <div id="empty-state">
      <strong>No results yet</strong>
      <p>Click "Scrape Now" to fetch the latest prices.</p>
    </div>
    <table id="results-table" style="display:none;">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Product Name</th>
          <th>TenXYou Price</th>
          <th>Myntra Price</th>
          <th>Gap</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</main>

<div id="toast"></div>

<script>
  const btnScrape = document.getElementById('btn-scrape');
  const btnExport = document.getElementById('btn-export');
  const spinner   = document.getElementById('spinner');
  const label     = document.getElementById('btn-scrape-label');
  const tbody     = document.getElementById('results-body');
  const table     = document.getElementById('results-table');
  const empty     = document.getElementById('empty-state');
  const statCount = document.getElementById('stat-count');
  const statTime  = document.getElementById('stat-time');
  const toast     = document.getElementById('toast');

  function showToast(msg, duration = 3000) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  }

  function formatTimestamp(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  function parsePrice(str) {
    if (!str) return null;
    const num = parseFloat(str.replace(/[^0-9.]/g, ''));
    return isNaN(num) ? null : num;
  }

  function gapHtml(tenxyouStr, myntraStr) {
    const t = parsePrice(tenxyouStr);
    const m = parsePrice(myntraStr);
    if (!t || !m) return '<span class="gap-badge gap-neutral">—</span>';
    const pct = ((m - t) / t * 100).toFixed(1);
    const cls = pct > 0 ? 'gap-positive' : pct < 0 ? 'gap-negative' : 'gap-neutral';
    const sign = pct > 0 ? '+' : '';
    return `<span class="gap-badge ${cls}">${sign}${pct}%</span>`;
  }

  function renderResults(data) {
    const rows = data.results || [];
    statCount.textContent = rows.length;
    statTime.textContent  = formatTimestamp(data.timestamp);

    if (rows.length === 0) {
      table.style.display = 'none';
      empty.style.display = '';
      return;
    }

    tbody.innerHTML = rows.map(r => {
      const statusCls = r.status === 'success' ? 'status-success'
                      : r.status === 'partial'  ? 'status-partial'
                      : 'status-error';
      const statusIcon = r.status === 'success' ? '✓' : r.status === 'partial' ? '~' : '✗';
      const statusHtml = `<span class="status-badge ${statusCls}">${statusIcon} ${r.status}</span>`;
      const name   = r.name || '—';
      const sku    = r.sku  || '—';
      const mPrice = r.myntra_price   || '—';
      const tPrice = r.tenxyou_price;
      const tPriceHtml = tPrice
        ? `<span class="tenxyou-price">${tPrice}</span>`
        : '<span style="color:#aaa">—</span>';
      return `<tr>
        <td><span class="sku-badge">${sku}</span></td>
        <td>${name}</td>
        <td>${tPriceHtml}</td>
        <td><span class="price">${mPrice}</span></td>
        <td>${gapHtml(tPrice, r.myntra_price)}</td>
        <td>${statusHtml}</td>
      </tr>`;
    }).join('');

    empty.style.display = 'none';
    table.style.display = '';
  }

  async function loadExisting() {
    try {
      const res = await fetch('/results');
      const data = await res.json();
      if (data.results && data.results.length > 0) renderResults(data);
    } catch (_) {}
  }

  btnScrape.addEventListener('click', async () => {
    btnScrape.disabled = true;
    btnExport.disabled = true;
    spinner.style.display = 'block';
    label.textContent = 'Scraping…';

    try {
      const res  = await fetch('/scrape', { method: 'POST' });
      const data = await res.json();
      renderResults(data);
      showToast(`Done — ${data.count} SKU${data.count !== 1 ? 's' : ''} scraped`);
    } catch (err) {
      showToast('Scrape failed. Check the console.', 4000);
      console.error(err);
    } finally {
      spinner.style.display = 'none';
      label.textContent = 'Scrape Now';
      btnScrape.disabled = false;
      btnExport.disabled = false;
    }
  });

  btnExport.addEventListener('click', () => {
    window.location.href = '/export';
  });

  loadExisting();
</script>
</body>
</html>
